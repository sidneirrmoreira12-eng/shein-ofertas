<!DOCTYPE html>
<html lang="pt-br">
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #000000, #1f1f1f);
    margin: 0;
    padding: 0;
    color: #333;
  }

  h1 {
    text-align: center;
    padding: 20px;
    color: #fff;
    font-size: 26px;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 15px;
  }

  .produto {
    background: #fff;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.3s;
  }

  .produto:hover {
    transform: scale(1.05);
  }

  img {
    width: 100%;
    border-radius: 12px;
  }

  h2 {
    font-size: 18px;
    margin: 10px 0;
  }

  p {
    font-size: 14px;
    color: #555;
  }

  a {
    display: block;
    margin-top: 10px;
    padding: 14px;
    background: #00c853;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
  }

  a:hover {
    background: #00a844;
  }
</style>

<body>

<h1>🔥 Achadinhos da SHEIN 🔥</h1>

<div class="produto">
  <img src="https://via.placeholder.com/250">
  <h2>Produto em oferta</h2>
  <p>Preço bom e entrega rápida</p>
  <a href="SEU_LINK_AFILIADO_AQUI" target="_blank">Comprar na SHEIN</a>
</div>

</body>
</html>
