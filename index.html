<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Achadinhos SHEIN</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

/* TOPO */
header {
  background: linear-gradient(135deg, #ff0055, #ff8c00);
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin-top: 5px;
  font-size: 14px;
}

/* CONTAINER */
.container {
  padding: 15px;
}

/* PRODUTO */
.produto {
  background: white;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  overflow: hidden;
}

.produto img {
  width: 100%;
  height: auto;
}

/* TEXTO */
.info {
  padding: 15px;
}

.info h2 {
  font-size: 18px;
  margin: 0 0 8px 0;
}

.info p {
  font-size: 14px;
  color: #555;
}

/* BOTÃO */
.info a {
  display: block;
  margin-top: 12px;
  padding: 14px;
  background: #00c853;
  color: white;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  border-radius: 10px;
}
</style>
</head>

<header>
  <h1>🔥 Achadinhos da SHEIN 🔥</h1>
  <p>Produtos bem avaliados com preço top</p>
</header>
