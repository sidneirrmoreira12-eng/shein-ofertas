<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Achadinhos SHEIN</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 0;
}

/* TOPO */
header {
  background: linear-gradient(135deg, #ff0055, #ff7a00);
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin-top: 5px;
  font-size: 14px;
}

/* CONTAINER */
.container {
  padding: 15px;
}

/* CARD DO PRODUTO */
.produto {
  background: white;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  overflow: hidden;
}

/* GALERIA */
.galeria {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
}

.galeria img {
  width: 100%;
  max-width: 320px;
  flex-shrink: 0;
  scroll-snap-align: center;
}

/* TEXTO */
.info {
  padding: 15px;
}

.info h2 {
  font-size: 18px;
  margin: 0 0 8px 0;
}

.info p {
  font-size: 14px;
  color: #555;
}

/* BOTÃO */
.info a {
  display: block;
  margin-top: 12px;
  padding: 14px;
  background: #00c853;
  color: white;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🔥 Achadinhos da SHEIN 🔥</h1>
  <p>Produtos bem avaliados e com preço top</p>
</header>

<div class="container">

  <!-- PRODUTO 1 -->
  <div class="produto">

    <div class="galeria">
      <img src="quiksilver1.jpg">
      <img src="quiksilver2.jpg">
    </div>

    <div class="info">
      <h2>Calça Moletom Quiksilver</h2>
      <p>Estilo urbano, confortável e ótima qualidade</p>
      <a href="https://onelink.shein.com/28/5ew5xx7ubpjw" target="_blank">
        Comprar na SHEIN
      </a>
    </div>

  </div>

</div>

</body>
</html>
